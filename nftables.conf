#!/usr/sbin/nft -f
flush ruleset

table inet filter {
    set enrolled {
        type ether_addr
    }

    chain input {
        type filter hook input priority 0; policy drop;
        ct state established,related accept
        iif lo accept
        iif "eth0" tcp dport 22 accept
        iif "wlan0" udp dport { 53, 67 } accept
        iif "wlan0" tcp dport 8883 accept
        icmp type echo-request accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        iif "wlan0" ether saddr @enrolled accept
        iif "eth0" oif "wlan0" accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        oif "eth0" masquerade
    }
}
